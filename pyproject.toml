[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcode-local"
version = "0.1.0"
description = "Local bridge between a Git repository and ChatGPT"
requires-python = ">=3.11"

[project.scripts]
chatcode = "chatcode.cli:main"

[tool.setuptools.packages.find]
include = ["chatcode*"]