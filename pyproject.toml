[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatcode-local"
version = "0.1.0"
description = "Local patch-validation bridge for ChatGPT-generated diffs"
requires-python = ">=3.11"

[project.scripts]
chatcode = "chatcode.cli:main"

[tool.setuptools.packages.find]
include = ["chatcode*"]

[tool.pytest.ini_options]
# ChatCode keeps patch previews and history snapshots under ``workspace/``.
# They can contain copies of tests, but are artifacts rather than part of this
# repository's test suite.
testpaths = ["tests"]
